name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
          - os: macos-15-intel
            target: mac-x64
          - os: windows-2022
            target: win-x64
          - os: windows-2022
            target: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (process.env.RELEASE_TAG !== 'v' + p.version) throw new Error('Tag must match package.json version');"
      - run: npm ci
      - run: npm test
      - run: npm run desktop -- ${{ matrix.target }}
      - name: Verify packaged application
        run: node scripts/verify-desktop.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: jira-workbench-${{ matrix.target }}
          path: release/jira-workbench-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jira-workbench-*
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages/* --verify-tag --title "Jira 工作台 $RELEASE_TAG" --generate-notes
